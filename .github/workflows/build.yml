name: Build Binaries
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag/version to build. Defaults to package.json version.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Pack npm Candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Store npm Candidate
        uses: node-3d/addon-tools/actions/npm-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16

  build:
    name: Build (${{ matrix.target }})
    needs: package
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: &native-matrix
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            cuda_version: '12.9'
          - target: windows-arm64
            os: windows-11-arm
            node_arch: arm64
            cuda_version: '13.4'
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            cuda_version: '12.9'
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
            cuda_version: '12.9'

    runs-on: ${{ matrix.os }}

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'

      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"
          npm config get arch

      - name: Install CUDA Toolkit - Windows
        if: ${{ startsWith(matrix.target, 'windows') }}
        shell: pwsh
        timeout-minutes: 30
        run: .github/scripts/install-cuda.ps1 -Version '${{ matrix.cuda_version }}'

      - name: Install CUDA Toolkit - Linux
        if: ${{ startsWith(matrix.target, 'linux') }}
        timeout-minutes: 30
        run: bash .github/scripts/install-cuda.sh '${{ matrix.cuda_version }}'

      - name: Install Modules
        run: npm ci

      - name: Build Current Binary
        run: npm run build:rebuild
      - name: Store Native Candidate
        uses: node-3d/addon-tools/actions/native-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          artifact-name: native-${{ matrix.target }}

  consumer-tests:
    name: Packed Consumer (${{ matrix.target }})
    needs: [package, build]
    strategy:
      fail-fast: false
      matrix: *native-matrix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
      - name: Install CUDA Toolkit - Windows
        if: ${{ matrix.native_build && startsWith(matrix.target, 'windows') }}
        shell: pwsh
        timeout-minutes: 30
        run: .github/scripts/install-cuda.ps1 -Version '${{ matrix.cuda_version }}'
      - name: Install CUDA Toolkit - Linux
        if: ${{ matrix.native_build && startsWith(matrix.target, 'linux') }}
        timeout-minutes: 30
        run: bash .github/scripts/install-cuda.sh '${{ matrix.cuda_version }}'
      - name: Install Packed Consumer Candidate
        id: consumer
        uses: node-3d/addon-tools/actions/consumer-install@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          package-name: '@node-3d/cuda'
          binary-artifact: native-${{ matrix.target }}
          fixture: test-consumer
      - name: Run Packed Consumer Tests
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm test

  release:
    name: Create Release
    needs: consumer-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Get Package Version
        id: package-version
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="$(node -p "require('./package').version")"
          fi
          echo "version=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Download Native Candidates
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-candidates
          merge-multiple: true
      - name: Attest Binaries
        uses: actions/attest@v4
        with:
          subject-path: release-candidates/*.gz
      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.package-version.outputs.version }}
          name: Release ${{ steps.package-version.outputs.version }}
          files: release-candidates/*.gz
